<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Séamus Grew - Software Engineer</title>
  <meta name="title" content="Séamus Grew - Software Engineer">
  <meta name="description"
    content="I'm Séamus, a Software Engineer educated at Queen's University Belfast, building AI-powered applications, enterprise software, cloud-hosted systems and large-scale data pipelines.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Séamus Grew - Software Engineer">
  <meta property="og:description"
    content="I'm Séamus, a Software Engineer educated at Queen's University Belfast, building AI-powered applications, enterprise software, cloud-hosted systems and large-scale data pipelines.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Séamus Grew - Software Engineer">
  <meta name="twitter:description"
    content="I'm Séamus, a Software Engineer educated at Queen's University Belfast, building AI-powered applications, enterprise software, cloud-hosted systems and large-scale data pipelines.">

  <link rel="icon" href="../static/images/favicon.svg" type="image/svg+xml">
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
</body>

</html>
